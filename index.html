<!doctype html>
<html lang="es">
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<meta charset="utf-8">
<title>El Honesto Juego</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
@font-face{font-family:"Friz Quadrata";src:url("TIPOGRAFIA/Friz%20Quadrata%20Bold.otf") format("opentype");font-weight:400 900;font-display:block}
/* Layout: cabina arcade en una columna — marquesina con título, pantalla 16:9 enmarcada, leyenda de controles y pad táctil */
:root{
  --void:#0a0606; --cab:#150a0a; --edge:#3d1515; --ink:#f4ede1; --dim:#b9a8a4; --pink:#e5262b; --fire:#ff7a1a;
  --display:"Friz Quadrata",Georgia,serif;
  --hud:"Friz Quadrata",Georgia,serif;
  --mono:"Friz Quadrata",Georgia,serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:#000;color:var(--ink);font-family:var(--mono);font-size:14px}
body::before{content:"";position:fixed;inset:0;background:url("FONDO%20JUEGO/whats-new-hero.webp") center/cover no-repeat;opacity:.1;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1}
.wrap{box-sizing:border-box;min-height:100%;justify-content:center;align-items:center;max-width:1120px;margin:0 auto;padding-block:16px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
header{display:flex;justify-content:center;text-align:center}
h1{margin:0;line-height:0;display:flex;justify-content:center;width:100%}
h1 img{display:block;width:min(100px,24vw);max-width:100%;height:auto;filter:drop-shadow(4px 4px 0 var(--pink))}
.screen{width:100%;box-sizing:border-box;background:var(--cab);border:2px solid var(--edge);border-radius:6px;padding:8px;box-shadow:0 0 0 6px #000,0 0 48px rgba(229,38,43,.16)}
.bar{display:flex;justify-content:center;flex-wrap:wrap;column-gap:24px;align-items:center;gap:8px;padding:0 2px 8px;font-family:var(--hud);font-size:11px;letter-spacing:.08em;color:var(--dim)}
canvas{display:block;width:100%;max-width:100%;aspect-ratio:16/9;background:#000;outline:none;touch-action:none;cursor:pointer}
canvas:focus-visible{box-shadow:0 0 0 2px var(--pink)}
#track{color:var(--pink);letter-spacing:.04em}
#mute{font-family:var(--hud);font-size:11px;letter-spacing:.06em;color:var(--ink);background:transparent;border:1px solid var(--edge);border-radius:4px;padding:3px 8px;cursor:pointer}
#mute:focus-visible,.pad button:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
.keys{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 22px;color:var(--dim);font-size:13px;text-align:center}
.keys div{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap}
kbd{font-family:var(--hud);font-size:11px;color:var(--ink);background:var(--cab);border:1px solid var(--edge);border-bottom-width:3px;border-radius:4px;padding:2px 6px}
.pad{display:none;justify-content:center;flex-wrap:wrap;column-gap:40px;align-items:center;gap:12px;user-select:none;-webkit-user-select:none;touch-action:none}
.dpad{display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(3,54px);gap:4px}
.pad button{font-family:var(--hud);color:var(--ink);background:var(--cab);border:2px solid var(--edge);border-radius:10px;touch-action:none;font-size:12px}
.pad button.on{background:var(--pink);color:#000}
.dpad .u{grid-area:1/2}.dpad .l{grid-area:2/1}.dpad .r{grid-area:2/3}.dpad .d{grid-area:3/2}
.btns{display:grid;grid-template-columns:repeat(3,64px);grid-auto-flow:row dense;grid-template-rows:repeat(2,58px);gap:6px}
.btns .big{background:#2a0c0c;border-color:var(--pink)}
.btns .wide{grid-column:span 2}
@media (pointer:coarse){.pad{display:flex}.keys{display:none}}

/* ===== MOBILE FIRST: en celular el juego ocupa toda la pantalla horizontal y los controles van encima ===== */
#rotate{display:none;position:fixed;inset:0;z-index:20;background:#000;color:var(--ink);flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;font-family:var(--hud);padding:24px}
#rotate img{width:150px;height:auto;filter:drop-shadow(3px 3px 0 var(--pink))}
#rotate .ph{width:44px;height:74px;border:4px solid var(--ink);border-radius:9px;animation:girar 1.8s ease-in-out infinite}
#rotate b{font-size:20px;letter-spacing:.06em;color:var(--pink)}
#rotate span{font-size:13px;color:var(--dim)}
@keyframes girar{0%,20%{transform:rotate(0)}55%,85%{transform:rotate(-90deg)}100%{transform:rotate(0)}}
body.mobile{position:fixed;inset:0;overflow:hidden;touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
body.mobile::before{display:none}
body.mobile .wrap{max-width:none;height:100%;min-height:0;padding:0;margin:0;display:block}
body.mobile header,body.mobile .keys{display:none}
body.mobile .screen{position:fixed;inset:0;border:0;border-radius:0;padding:0;box-shadow:none;background:#000;display:flex;align-items:center;justify-content:center}
body.mobile canvas{width:min(100vw,calc(100dvh * 16 / 9));height:auto;max-height:100dvh}
body.mobile .bar{position:fixed;top:max(6px,env(safe-area-inset-top,0px));right:max(8px,env(safe-area-inset-right,0px));z-index:5;padding:0;gap:0}
body.mobile #where,body.mobile #track{display:none}
body.mobile #mute{background:rgba(0,0,0,.5);font-size:10px;padding:4px 8px}
body.mobile .pad{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:4;justify-content:space-between;align-items:flex-end;padding:0 max(14px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));pointer-events:none}
body.mobile .pad>*{pointer-events:auto}
body.mobile .dpad{grid-template-columns:repeat(3,50px);grid-template-rows:repeat(3,50px);gap:2px}
body.mobile .btns{grid-template-columns:repeat(3,58px);grid-template-rows:repeat(2,54px);gap:6px}
body.mobile .pad button{background:rgba(21,10,10,.45);border-color:rgba(229,38,43,.55);color:rgba(244,237,225,.9);font-size:11px}
body.mobile .pad button.on{background:rgba(229,38,43,.85);color:#000}
@media (orientation:portrait){body.mobile #rotate{display:flex}}

/* mango virtual: se arrastra el dedo dentro del círculo y el personaje se mueve mientras se mantiene */
.stick{position:relative;width:132px;height:132px;border-radius:50%;background:rgba(21,10,10,.35);border:2px solid rgba(229,38,43,.5);touch-action:none;box-shadow:inset 0 0 18px rgba(0,0,0,.5)}
.stick .knob{position:absolute;left:50%;top:50%;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;background:rgba(229,38,43,.55);border:2px solid rgba(244,237,225,.65);pointer-events:none;transition:transform .08s}
.stick.on .knob{transition:none;background:rgba(229,38,43,.8)}
body.mobile .btns{grid-template-columns:repeat(2,68px);grid-template-rows:44px 62px;gap:8px}
body.mobile .btns .esp{grid-column:span 2}
</style>
</head>
<body>
<div id="rotate" aria-live="polite"><img src="LOGO%20JUEGO/11.png" alt="El Honesto Juego"><div class="ph" aria-hidden="true"></div><b>GIRA TU TELÉFONO</b><span>El Honesto Juego se juega en horizontal</span></div>

<div class="wrap">
  <header>
    <h1><img src="LOGO%20JUEGO/11.png" alt="El Honesto Juego" width="1254" height="1254"></h1>
  </header>

  <div class="screen">
    <div class="bar"><span id="where">SANTIAGO · 23:57</span><span id="track" aria-live="polite"></span><button id="mute" type="button">SONIDO: ON</button></div>
    <canvas id="c" tabindex="0" aria-label="Juego Pogo del Fin del Mundo"></canvas>
  </div>

  <div class="keys">
    <div><kbd>←</kbd><kbd>→</kbd><kbd>↑</kbd><kbd>↓</kbd> moverse</div>
    <div><kbd>A</kbd> golpe</div>
    <div><kbd>S</kbd> salto</div>
    <div><kbd>W</kbd> especial · con la barra llena, DEAL WITH IT!</div>
    <div><kbd>P</kbd> pausa · <kbd>M</kbd> sonido</div>
  </div>

  <div class="pad" id="pad">
    <div class="stick" id="stick" aria-label="mover"><div class="knob"></div></div>
    <div class="btns">
      <button type="button" data-k="s" class="esp">ESP</button>
      <button type="button" data-k="j" class="big">SALTO</button>
      <button type="button" data-k="a" class="big">GOLPE</button>
    </div>
  </div>
</div>

<script>
(()=>{
'use strict';
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
// celular: pantalla táctil y pantalla chica → modo pantalla completa con controles encima y menor resolución interna
const MOBILE=matchMedia('(pointer:coarse)').matches&&Math.min(screen.width,screen.height)<=900;
if(MOBILE){document.body.classList.add('mobile');
  const fs=()=>{const d=document.documentElement;if(document.fullscreenElement||!d.requestFullscreen)return;d.requestFullscreen({navigationUI:'hide'}).then(()=>{try{screen.orientation.lock('landscape').catch(()=>{})}catch(_){}}).catch(()=>{})};
  addEventListener('pointerdown',fs,{passive:true});
  document.addEventListener('gesturestart',e=>e.preventDefault());}
const W=960,H=540,TOP=335,BOT=525,GRAV=1500,SC=MOBILE?1.5:2;
// límite superior caminable por sucursal (algunas veredas quedan más abajo en el fondo)
function yTop(){return (typeof STAGES!=='undefined'&&STAGES[stI]&&STAGES[stI].yTop)||TOP}
cv.width=W*SC;cv.height=H*SC;
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const R=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)],clamp=(v,a,b)=>v<a?a:v>b?b:v;
const sr=i=>{const s=Math.sin(i*127.1+311.7)*43758.5453;return s-Math.floor(s)};
const HUDF='"Friz Quadrata",Georgia,serif',GLF='"Friz Quadrata",Georgia,serif';
const whereEl=document.getElementById('where'),trackEl=document.getElementById('track'),muteBtn=document.getElementById('mute');

/* ================= AUDIO ================= */
let AC=null,master,mus,sfxG,nbuf,distC,muted=false;
function initAudio(){
  startMusic();
  if(AC){if(AC.state==='suspended')AC.resume();return}
  try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){AC=null;return}
  master=AC.createGain();master.gain.value=muted?0:.55;master.connect(AC.destination);
  mus=AC.createGain();mus.gain.value=.3;mus.connect(master);
  sfxG=AC.createGain();sfxG.gain.value=.8;sfxG.connect(master);
  nbuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=nbuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  distC=new Float32Array(1024);for(let i=0;i<1024;i++){const x=i/512-1;distC[i]=Math.tanh(x*7)}
  nextT=AC.currentTime+.05;
}
function env(g,t,a,peak,dur){g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+dur)}
function tone(f,dur,type,vol,f2,dest,t){dest=dest||sfxG;t=t===undefined?AC.currentTime:t;const o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);env(g,t,.005,vol,dur);o.connect(g);g.connect(dest);o.start(t);o.stop(t+dur+.03)}
function nz(dur,freq,vol,type,q,dest,t){dest=dest||sfxG;t=t===undefined?AC.currentTime:t;const s=AC.createBufferSource();s.buffer=nbuf;const f=AC.createBiquadFilter();f.type=type||'bandpass';f.frequency.value=freq;f.Q.value=q||1;const g=AC.createGain();env(g,t,.003,vol,dur);s.connect(f);f.connect(g);g.connect(dest);s.start(t,Math.random()*.5);s.stop(t+dur+.03)}
function sfx(n){
  if(!AC||muted)return;const c=AC.currentTime;
  switch(n){
    case'hit':nz(.08,1400,.5);tone(170,.1,'square',.22,55);break;
    case'big':nz(.2,700,.75);tone(130,.25,'sawtooth',.35,35);break;
    case'swing':nz(.07,3200,.12,'highpass');break;
    case'jump':tone(260,.12,'square',.1,520);break;
    case'hurt':tone(330,.25,'sawtooth',.25,90);nz(.1,900,.3);break;
    case'special':[0,4,7,12].forEach((s,i)=>tone(220*Math.pow(2,s/12),.25,'sawtooth',.14,null,sfxG,c+i*.03));nz(.3,2200,.3);break;
    case'pick':[0,7,12].forEach((s,i)=>tone(660*Math.pow(2,s/12),.1,'square',.12,null,sfxG,c+i*.06));break;
    case'boom':nz(.8,280,.9,'lowpass');tone(90,.6,'sine',.6,28);break;
    case'charge':tone(110,.6,'sawtooth',.16,900);break;
    case'saw':nz(.15,520,.25,'bandpass',4);tone(90,.15,'sawtooth',.14,120);break;
    case'rage':[0,3,7,10,12,15,19].forEach((s,i)=>tone(110*Math.pow(2,s/12),.45,'sawtooth',.13,null,sfxG,c+i*.05));nz(.5,1500,.3);break;
    case'ko':tone(220,1.3,'sawtooth',.3,38);nz(1.1,420,.6,'lowpass');break;
    case'tink':tone(1800,.08,'square',.12,2600);break;
    case'clear':[0,4,7,12,7,12,16].forEach((s,i)=>tone(330*Math.pow(2,s/12),.18,'square',.13,null,sfxG,c+i*.11));break;
    case'beep':tone(880,.06,'square',.08);break;
  }
}
let nextT=0,stepN=0,bpm=172,musicMode='off';
const PROGS=[[0,0,3,5],[0,3,-2,5],[0,5,3,7],[0,-2,-4,-5]];
/* Playlist: cada tema suena 45 s, se desvanece y entra el siguiente */
const TRACKS=[
  {src:'audio/tema1.m4a',gain:1.0,name:'Bad Religion · American Jesus'},
  {src:'audio/tema2.m4a',gain:1.1,name:"NOFX · Stickin' In My Eye"},
  {src:'audio/tema3.m4a',gain:0.56,name:'Motörhead · Ace Of Spades'},
  {src:'audio/tema4.m4a',gain:1.33,name:'Turbonegro · All My Friends Are Dead'},
  {src:'audio/tema5.m4a',gain:0.57,name:'Descendents · Hope'},
  {src:'audio/tema6.m4a',gain:0.79,name:'Metallica · Master of Puppets'},
  {src:'audio/tema7.m4a',gain:0.72,name:"MxPx · I'm OK, You're OK"},
  {src:'audio/tema8.m4a',gain:1.32,name:'No Use For A Name · Invincible'},
  {src:'audio/tema9.m4a',gain:2.28,name:'Pantera · Walk'},
  {src:'audio/tema10.m4a',gain:1.27,name:'Rancid · Time Bomb'},
  {src:'audio/tema11.m4a',gain:2.58,name:"Social Distortion · Don't Drag Me Down"},
];
const SEG=45,FADE=3,MVOL=.6,BOSS_TRK=2;let trk=-1,mel=null,musicOn=false,bossTrack=false;let musBus=null,melGain=1;
function setBossMusic(on){if(bossTrack===on)return;bossTrack=on;if(!musicOn)return;if(on)trk=BOSS_TRK-1;nextTrack()}
function startMusic(){if(musicOn)return;musicOn=true;nextTrack()}
function nextTrack(){
  if(mel)mel.pause();
  if(bossTrack)trk=BOSS_TRK;else{let n;do{n=Math.floor(Math.random()*TRACKS.length)}while(n===BOSS_TRK||n===trk);trk=n}const T=TRACKS[trk];
  const me=mel=new Audio(T.src);mel.preload='auto';mel.volume=0;
  // nivelación: cada canción tiene su ganancia (medida a ~-16 LUFS) y pasa por un limitador para no saturar
  melGain=T.gain||1;if(AC){try{if(!musBus){musBus=AC.createDynamicsCompressor();musBus.threshold.value=-3;musBus.knee.value=2;musBus.ratio.value=12;musBus.attack.value=.003;musBus.release.value=.15;musBus.connect(AC.destination)}
    const src=AC.createMediaElementSource(mel),g=AC.createGain();g.gain.value=melGain;src.connect(g).connect(musBus);melGain=1}catch(e){melGain=Math.min(1,T.gain||1)}}else melGain=Math.min(1,melGain);
  mel.addEventListener('error',()=>{if(mel===me)setTimeout(()=>{if(mel===me)nextTrack()},400)},{once:true});
  mel.addEventListener('ended',()=>{if(mel===me)nextTrack()},{once:true});
  if(!muted)mel.play().catch(()=>{});
  trackEl.textContent='♪ '+T.name;
}
function musicTick(){
  if(!mel)return;
  if(muted||gs==='pause'){if(!mel.paused)mel.pause();return}
  if(mel.paused&&mel.readyState>0)mel.play().catch(()=>{});
  const t=mel.currentTime;
  if(!bossTrack&&t>=SEG){nextTrack();return}
  let v=MVOL*Math.min(1,t/.6);
  if(!bossTrack&&t>SEG-FADE)v*=Math.max(0,(SEG-t)/FADE);
  mel.volume=clamp(v*melGain,0,1);
}
function playStep(s,t){
  if(muted||musicMode==='off')return;
  const bar=s>>4,st=s&15,boss=musicMode==='boss',title=musicMode==='title';
  const prog=boss?[0,1,0,-1]:title?[0,0,5,3]:PROGS[stI%4];
  const root=82.41*Math.pow(2,prog[bar]/12);
  if(!title||bar>1){
    if(st===0||st===8||st===10||(boss&&st%4===0))kick(t);
    if(st===4||st===12||(boss&&st===14))snare(t);
    if(st%2===0)nz(.03,8000,.07,'highpass',1,mus,t);
  }
  if(st%2===0)gtr(root,t,boss&&st%8===6?1.5:1);
}
function kick(t){const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(40,t+.12);env(g,t,.002,.9,.16);o.connect(g);g.connect(mus);o.start(t);o.stop(t+.2)}
function snare(t){nz(.14,1800,.45,'bandpass',.8,mus,t);tone(190,.08,'triangle',.25,140,mus,t)}
function gtr(f,t,mul){
  const ws=AC.createWaveShaper();ws.curve=distC;const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2300;const g=AC.createGain();env(g,t,.004,.2,.13);
  [1,1.5,2].forEach(m=>{const o=AC.createOscillator();o.type='sawtooth';o.frequency.value=f*m*mul;o.detune.value=R(-9,9);o.connect(ws);o.start(t);o.stop(t+.16)});
  ws.connect(lp);lp.connect(g);g.connect(mus);
  const b=AC.createOscillator(),bg=AC.createGain();b.type='square';b.frequency.value=f/2*mul;env(bg,t,.004,.11,.12);b.connect(bg);bg.connect(mus);b.start(t);b.stop(t+.15);
}
function toggleMute(){muted=!muted;if(master)master.gain.value=muted?0:.55;muteBtn.textContent=muted?'SONIDO: OFF':'SONIDO: ON'}
muteBtn.addEventListener('click',()=>{initAudio();toggleMute();cv.focus()});

/* ================= INPUT ================= */
const keys={},pressed={};
const KM={ArrowLeft:'l',ArrowRight:'r',ArrowUp:'u',ArrowDown:'d',KeyA:'a',KeyS:'j',KeyW:'s',Enter:'start',KeyP:'pause',Escape:'pause',KeyM:'mute'};
let lastTap={l:-9,r:-9},dtap=false;
function press(k){if(!keys[k]){pressed[k]=true;if(k==='l'||k==='r'){if(clock-lastTap[k]<.25)dtap=true;lastTap[k]=clock}}keys[k]=true}
function release(k){keys[k]=false}
addEventListener('keydown',e=>{const k=KM[e.code];if(!k)return;if(document.activeElement===muteBtn&&(e.code==='Space'||e.code==='Enter'))return;e.preventDefault();initAudio();press(k)});
addEventListener('keyup',e=>{const k=KM[e.code];if(k)release(k)});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;if(gs==='play')gs='pause'});
cv.addEventListener('pointerdown',ev=>{cv.focus();initAudio();if(gs==='select'){const r=cv.getBoundingClientRect(),x=(ev.clientX-r.left)/r.width*W,y=(ev.clientY-r.top)/r.height*H,i=LEVELS.findIndex((L,k)=>{const b=levelBox(k);return x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h});if(i>=0){if(i===selI)pressed.start=true;else{selI=i;sfx('beep')}}return}if(gs==='title'||gs==='howto'||gs==='over'||gs==='win'||gs==='pause'||gs==='intro')pressed.start=true});
document.querySelectorAll('#pad button').forEach(b=>{
  const k=b.dataset.k;
  b.addEventListener('pointerdown',e=>{e.preventDefault();initAudio();b.classList.add('on');try{b.setPointerCapture(e.pointerId)}catch(_){};keys[k]=false;press(k);if(k==='a'&&gs!=='play')pressed.start=true});
  const up=()=>{b.classList.remove('on');release(k)};
  b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('lostpointercapture',up);b.addEventListener('pointerleave',up);
});

/* mango virtual (sin doble toque para no activar el dash sin querer) */
(()=>{const st=document.getElementById('stick');if(!st)return;const kn=st.querySelector('.knob');let pid=null,cx=0,cy=0;
  const set=(k,on)=>{if(on){if(!keys[k])pressed[k]=true;keys[k]=true}else keys[k]=false};
  const upd=(x,y)=>{const R=st.clientWidth/2,max=R*.62,dx=x-cx,dy=y-cy,d=Math.hypot(dx,dy),f=d>max?max/d:1;kn.style.transform='translate('+dx*f+'px,'+dy*f+'px)';
    const dead=R*.2,ax=Math.abs(dx),ay=Math.abs(dy);
    set('l',dx<-dead&&ax>ay*.4);set('r',dx>dead&&ax>ay*.4);set('u',dy<-dead&&ay>ax*.4);set('d',dy>dead&&ay>ax*.4)};

function pose(e,k){
  const p={lean:0,bob:0,fa:1.85,fx:20,ba:1.55,bx:18,fl:.12,bl:-.12,ll:40};
  const a=e.anim,st=e.st,zomb=k==='zombie'||k==='gerente';
  if(st==='idle'){p.bob=Math.sin(a*5)*1.5}

    const s=Math.sin(a*(st==='charging'||st==='sawing'?20:11));p.fl=s*.55;p.bl=-s*.55;p.fa=1.7-s*.35;p.ba=1.5+s*.35;p.bob=-Math.abs(s)*2;
    if(st==='charging'){p.lean=14;p.fa=1.45;p.fx=30}
    if(st==='sawing'){p.lean=10;p.fa=1.5;p.fx=26;p.ba=1.4}
    if(st==='dodge'){p.lean=-8;p.fl=.7;p.bl=-.4}
  }
  if(zomb&&(st==='idle'||st==='walk')){p.fa=1.45;p.ba=1.35;p.fx=28;p.bx=26}
  if(e.kind==='player'){
    switch(st){
      case'atk':{const ad=e.ad,ext=e.t>=ad.a0*.7;
        if(e.weapon){p.fa=ext?1.1:3;p.fx=28;p.ba=ext?1.2:2.9;p.lean=ext?10:-6}
        else if(e.step===1){p.fa=ext?1.57:1.2;p.fx=ext?36:18;p.lean=ext?5:0}
        else if(e.step===2){p.ba=ext?1.57:1.1;p.bx=ext?38:16;p.lean=ext?9:-2;p.fa=1.9}
        else{p.fa=ext?2.75:.9;p.fx=ext?36:20;p.lean=ext?6:-3;p.bob=ext?-5:2;p.fl=.45;p.bl=-.45}
        break}
      case'jump':p.fl=.7;p.bl=-.1;p.ll=34;p.fa=2.4;p.ba=2.2;break;
      case'jkick':p.fl=1.55;p.ll=46;p.bl=-.6;p.lean=-6;p.fa=2.3;p.ba=-1;break;
      case'dash':p.lean=12;p.fa=-.6;p.ba=-.8;p.fl=.6;p.bl=-.7;break;
      case'dashatk':p.lean=18;p.fa=1.2;p.fx=16;p.ba=1;p.fl=.6;p.bl=-.8;break;
      case'special':p.fa=1.57;p.fx=34;p.ba=-1.57;p.bx=34;p.fl=.5;p.bl=-.5;break;
    }
  }else{
    const A=e.A;
    if(st==='wind'||st==='cwind'||st==='sawwind'||st==='volley'||st==='toss'){p.lean=-5;p.fa=-.9;p.fx=24;if(A&&A.k==='lunge')p.lean=-9;if((A&&A.k==='throw')||st==='volley'||st==='toss')p.fa=2.8;if(st==='sawwind'){p.fa=1.5;p.fx=24;p.bob=Math.sin(a*40)*1.5}}
    if(st==='strike'&&A){p.lean=9;p.fa=1.57;p.fx=36;
      if(A.k==='lunge'){p.lean=16;p.fa=1.5;p.ba=1.5;p.bx=34}
      if(A.k==='throw')p.fa=1.3;
      if(A.k==='jk'){p.fl=1.55;p.ll=46;p.bl=-.6;p.lean=-6}
      if(A.k==='beam'){p.fa=1.57;p.fx=34;p.ba=1.57;p.bx=30}}
    if(st==='rec'){p.lean=3;p.bob=2}
    if(st==='djump'||st==='dfall'||st==='dhang'){p.fl=.8;p.bl=-.4;p.fa=2.6;p.ba=2.4}
  }
  if(st==='hurt'){p.lean=-11;p.fa=2.9;p.ba=2.5;p.fx=22;p.bob=1}
  if(st==='fall'||st==='down'||st==='dead'){p.fa=2.6;p.ba=2.9;p.fl=.3;p.bl=-.2}
  if(st==='getup'){p.fl=1.1;p.bl=-.5;p.ll=34}
  return p;
}

    const key=(k,x,y)=>{ctx.font='16px '+HUDF;const w=Math.max(34,ctx.measureText(k).width+18);ctx.fillStyle='#150a0a';ctx.fillRect(x,y-17,w,34);ctx.fillStyle='#3d1515';ctx.fillRect(x,y+13,w,4);ctx.strokeStyle='#f4ede1';ctx.lineWidth=1.5;ctx.strokeRect(x,y-17,w,34);txt(k,x+w/2,y,16,'#f4ede1','center',HUDF,0);return x+w+8};
    const rows=MOBILE?[[['MANGO'],'MOVERSE','arrastra el dedo en el círculo'],[['GOLPE'],'GOLPE','tócalo seguido para el combo de 3'],[['SALTO'],'SALTO','SALTO + GOLPE en el aire = patada voladora'],[['ESP'],'ESPECIAL','lanza una bola de energía · cuesta vida'],[['ESP'],'DEAL WITH IT!','con la barra roja llena · daño x2 por 8 s']]:[[['←','↑','↓','→'],'MOVERSE','doble toque hacia un lado = dash'],[['A'],'GOLPE','apriétalo seguido para el combo de 3'],[['S'],'SALTO','S + A en el aire = patada voladora'],[['W'],'ESPECIAL','lanza una bola de energía · cuesta vida'],[['W'],'DEAL WITH IT!','con la barra roja llena · daño x2 por 8 s']];
    rows.forEach((r,i)=>{const y=110+i*50;let x=150;r[0].forEach(k=>{x=key(k,x,y)});txt(r[1],400,y-8,17,'#ffe14a','left',HUDF,0);txt(r[2],400,y+12,13,'#b9a8a4','left',HUDF,0)});
    txt('ROMPE LAS CAJAS',W/2,372,17,'#e5262b','center',HUDF,0);
    const lst=LEVELS[selI].stage||0,it=[['sopaipilla','+30 vida'],['completo','+60 vida'],['mote','barra llena'],['guitarra','10 golpes']].map(q=>{const d=itemDef(q[0],lst);return[d.spr,d.name,q[1]]});
    it.forEach((q,i)=>{const cx=210+i*180,y=430;if(SPR.items.ok&&SPR.items.S[q[0]]){const f=SPR.items.F[SPR.items.S[q[0]][0]],sc=q[0]==='guitarra'?.32:.42*Math.min(1,96/f[3]);ctx.drawImage(SPR.items.img,f[0],f[1],f[2],f[3],cx-f[2]*sc/2,y-f[3]*sc,f[2]*sc,f[3]*sc)}txt(q[1],cx,y+16,13,'#f4ede1','center',HUDF,0);txt(q[2],cx,y+34,12,'#b9a8a4','center',HUDF,0)});
    if(howT>.5&&Math.floor(clock*2)%2)txt(MOBILE?'TOCA PARA EMPEZAR':'ENTER  /  TOCA PARA EMPEZAR',W/2,H-28,20,'#f4ede1','center');
  }else if(gs==='title'){
    pageBg();
    // por ahora solo el logo al centro (sin el parche de mezclilla)
    if(!drawLogo(W/2,110,240)){txt('EL HONESTO JUEGO',W/2,230,48,'#e5262b','center',GLF,8)}
    if(Math.floor(clock*2)%2)txt(MOBILE?'TOCA PARA EMPEZAR':'ENTER  /  TOCA PARA EMPEZAR',W/2,410,22,'#f4ede1','center');
    txt('DIFICULTAD: EXTREMA · 3 VIDAS · 2 CONTINUES',W/2,H-22,11,'#b9a8a4','center');
  }else{
    drawWorld();
    if(gs!=='win')drawHUD();
    if(gs==='intro'){const S=STAGES[stI];ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,H/2-90,W,170);txt(S.name,W/2,H/2-6,58,'#e5262b','center',GLF,8);txt(S.sub.toUpperCase(),W/2,H/2+48,14,'#f4ede1','center')}
    if(gs==='pause'){ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,0,W,H);txt('PAUSA',W/2,H/2-10,60,'#ffe14a','center',GLF,8);txt('P O ENTER PARA SEGUIR',W/2,H/2+44,14,'#f4ede1','center')}
    if(gs==='clear'){ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,H/2-110,W,220);txt('YA TIENES TU 10% DE DESCUENTO!',W/2,H/2-60,40,'#39ff6a','center',GLF,7);txt('BONO: '+clearBonus,W/2,H/2,18,'#ffe14a','center');txt('MEJOR COMBO: '+bestCombo,W/2,H/2+32,14,'#f4ede1','center');txt(stI<STAGES.length-1?'SIGUIENTE: '+STAGES[stI+1].name:'',W/2,H/2+66,14,'#b9a8a4','center')}
    if(gs==='over'){ctx.fillStyle='rgba(0,0,0,.72)';ctx.fillRect(0,0,W,H);txt('GAME OVER',W/2,H/2-60,76,'#ff2e1a','center',GLF,10);
      if(conts>0&&overT>0){txt('¿CONTINUAR? '+Math.ceil(overT),W/2,H/2+20,30,'#ffe14a','center');txt('ENTER / TOCA · QUEDAN '+conts+' · EL PUNTAJE VUELVE A CERO',W/2,H/2+62,13,'#f4ede1','center')}
      else txt('PERDISTE · ENTER',W/2,H/2+20,18,'#f4ede1','center');
      txt('PUNTAJE '+score,W/2,H/2+110,14,'#b9a8a4','center')}
    if(gs==='win'){ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,0,W,H);
      txt('PUNTAJE FINAL '+score,W/2,270,26,'#f4ede1','center');txt('MEJOR COMBO '+bestCombo+' GOLPES',W/2,310,16,'#e5262b','center');if(winT>3&&Math.floor(clock*2)%2)txt('ENTER PARA VOLVER',W/2,420,18,'#f4ede1','center')}
  }
  drawBanner();
  if(flashA>0){ctx.globalAlpha=flashA*.6;ctx.fillStyle=flashC;ctx.fillRect(-20,-20,W+40,H+40);ctx.globalAlpha=1}
  // scanlines
  ctx.fillStyle='rgba(0,0,0,.08)';for(let y=0;y<H;y+=3)ctx.fillRect(0,y,W,1);
}

/* ================= LOOP ================= */
let last=performance.now();
function frame(now){
  const dt=Math.min(.033,(now-last)/1000);last=now;
  try{update(dt);render()}catch(err){console.error(err)}
  requestAnimationFrame(frame);
}
let FONT_OK=false;document.fonts.load('20px "Friz Quadrata"').then(()=>{FONT_OK=true}).catch(()=>{FONT_OK=true});setTimeout(()=>{FONT_OK=true},4000);
requestAnimationFrame(frame);
cv.focus({preventScroll:true});
})();
</script>
